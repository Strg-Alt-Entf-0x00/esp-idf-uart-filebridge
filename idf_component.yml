version: "2.0.0"
description: "Universal ESP32 UART File Bridge - Binary protocol for reliable file transfer over UART/FT232R"
url: "https://github.com/Strg-Alt-Entf-0x00/esp-idf-uart-filebridge"
repository: "https://github.com/Strg-Alt-Entf-0x00/esp-idf-uart-filebridge.git"
license: "Unlicense"

dependencies:
  idf: ">=5.2.0"
  
  # Optional LittleFS backend - only downloaded when enabled via menuconfig
  joltwallet/littlefs:
    version: "^1.14.8"
    matches:
      - if: "$CONFIG{UART_FILEBRIDGE_BACKEND_LITTLEFS} == True"

files:
  include:
    - "include/**/*"
    - "src/**/*"
    - "CMakeLists.txt"
    - "Kconfig"
    - "README.md"
    - "LICENSE"
