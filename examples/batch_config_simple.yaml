# Simple batch upload configuration example
# Usage: esp-idf-uart-filebridge batch examples/batch_config_simple.yaml

version: "1.0"
description: "Upload data files and assets to ESP32"

device:
  port: "COM13"  # Change to your port (Windows: COM13, Linux: /dev/ttyUSB0)
  baud: 3000000

variables:
  project_root: "./my_project"  # Change to your project path
  data_type: "bin"

options:
  verbose: true
  progress_bar: true
  fail_fast: true

tasks:
  - name: "Create directories"
    type: "mkdir"
    path: "/sd/data"
    parents: true
    ignore_exists: true

  - name: "Upload primary datafile"
    type: "upload"
    source: "${project_root}/data/dataset.bin"
    destination: "/sd/data/dataset.bin"
    verify: true
    overwrite: false

  - name: "Upload asset files"
    type: "upload_dir"
    source: "${project_root}/assets/"
    destination: "/sd/assets/"
    pattern: "*.bin"
    verify: false
    overwrite: false
    create_dirs: true

  - name: "Verify installation"
    type: "list"
    path: "/sd/data/"
